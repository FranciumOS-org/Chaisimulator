<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت | مای پیکسل</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body>

<!-- ══════════ ورود مدیر ══════════ -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-brand">
      <svg viewBox="0 0 40 40" fill="none">
        <rect x="1" y="1" width="38" height="38" rx="11" stroke="#2EE6F5" stroke-opacity=".45" stroke-width="1.4"/>
        <g fill="#2EE6F5">
          <rect x="9" y="10" width="5" height="5" rx="1"/><rect x="26" y="10" width="5" height="5" rx="1"/>
          <rect x="9" y="16" width="5" height="5" rx="1"/><rect x="14.5" y="16" width="5" height="5" rx="1" opacity=".62"/>
          <rect x="20.5" y="16" width="5" height="5" rx="1" opacity=".62"/><rect x="26" y="16" width="5" height="5" rx="1"/>
          <rect x="9" y="22" width="5" height="5" rx="1"/><rect x="17.5" y="22" width="5" height="5" rx="1" opacity=".4"/>
          <rect x="26" y="22" width="5" height="5" rx="1"/>
          <rect x="9" y="28" width="5" height="5" rx="1"/><rect x="26" y="28" width="5" height="5" rx="1"/>
        </g>
      </svg>
      <div>
        <h1>پنل مدیریت مای پیکسل</h1>
        <p>فقط برای مدیر سایت</p>
      </div>
    </div>
    <div class="err-line" id="loginErr"></div>
    <div class="fld" style="margin-bottom:12px">
      <label for="lgUser">نام کاربری</label>
      <input class="inp" id="lgUser" autocomplete="username" placeholder="admin">
    </div>
    <div class="fld" style="margin-bottom:18px">
      <label for="lgPass">رمز عبور</label>
      <input class="inp" id="lgPass" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button class="btn btn-primary btn-block" id="lgBtn">ورود به پنل</button>
    <p class="hint" style="text-align:center;margin-top:14px">
      رمز پیش‌فرض بعد از نصب در خروجی <span class="mono">npm run seed</span> چاپ می‌شود.
    </p>
  </div>
</div>

<!-- ══════════ پنل ══════════ -->
<div class="sb-backdrop" id="sbBackdrop"></div>
<div class="admin-shell" id="shell">

  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <svg viewBox="0 0 40 40" fill="none">
        <rect x="1" y="1" width="38" height="38" rx="11" stroke="#2EE6F5" stroke-opacity=".4" stroke-width="1.4"/>
        <g fill="#2EE6F5">
          <rect x="9" y="10" width="5" height="5" rx="1"/><rect x="26" y="10" width="5" height="5" rx="1"/>
          <rect x="9" y="16" width="5" height="5" rx="1"/><rect x="14.5" y="16" width="5" height="5" rx="1" opacity=".62"/>
          <rect x="20.5" y="16" width="5" height="5" rx="1" opacity=".62"/><rect x="26" y="16" width="5" height="5" rx="1"/>
          <rect x="9" y="22" width="5" height="5" rx="1"/><rect x="17.5" y="22" width="5" height="5" rx="1" opacity=".4"/>
          <rect x="26" y="22" width="5" height="5" rx="1"/>
          <rect x="9" y="28" width="5" height="5" rx="1"/><rect x="26" y="28" width="5" height="5" rx="1"/>
        </g>
      </svg>
      <div><h2>مای پیکسل</h2><span class="mono">ADMIN</span></div>
    </div>
    <nav class="sb-nav" id="sbNav"></nav>
    <div class="sb-foot">
      <div class="sb-user">
        <div class="sb-avatar">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-4.2 3.4-6.6 7.5-6.6s7.5 2.4 7.5 6.6"/>
          </svg>
        </div>
        <div><b id="admName">—</b><small>مدیر کل</small></div>
      </div>
      <button class="btn btn-ghost btn-sm btn-block" id="logoutBtn">خروج از پنل</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle" aria-label="منو">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <h1 id="pageTitle">داشبورد</h1>
      <div class="spacer"></div>
      <a class="btn btn-ghost btn-sm" href="/" target="_blank">مشاهده سایت ↗</a>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

<script src="/assets/icons.js"></script>
<script src="/assets/admin.js"></script>
</body>
</html>
